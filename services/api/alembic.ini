# Configuracion de Alembic.
#
# La URL de la base NO se escribe aqui: la lee `migrations/env.py` de
# app.core.config, que a su vez la toma del entorno. Un DSN con contrasena en
# un archivo versionado es una fuga esperando a pasar.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Las revisiones se nombran con fecha + slug, para que `ls versions/` se lea en
# orden cronologico en vez de como una lista de hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
