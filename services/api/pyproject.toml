[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-api"
version = "0.1.0"
description = "Backend de The Cage 2.0: motor de autorregulacion, planes y sincronizacion"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    # [email] trae email-validator, que EmailStr necesita en tiempo de
    # ejecucion: sin el, importar los DTO revienta.
    "pydantic[email]>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    # Persistencia. Llegan en el siguiente bloque de la Fase 2.
    "sqlalchemy>=2.0.52,<2.1",
    "alembic>=1.20,<1.21",
    "asyncpg>=0.31,<0.32",
    # Seguridad. Argon2id para contrasenas, JWT para sesiones.
    "argon2-cffi>=25.1,<26",
    "pyjwt>=2.14,<3",
    "slowapi>=0.1.10,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
    "aiosqlite>=0.20,<0.22",
]

# Sin esto setuptools intenta empaquetar tambien `migrations/` y aborta con
# "Multiple top-level packages discovered in a flat-layout". El paquete
# distribuible es solo `app`; migrations y tests son herramientas del repo.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Las revisiones las escribe Alembic, no nosotros: reformatearlas a mano las
# aleja de lo que regenera `--autogenerate` y hace ilegible el diff.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
