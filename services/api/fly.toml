# Despliegue de la API de The Cage en Fly.io.
#
#   fly launch --no-deploy     (una sola vez, crea la app)
#   fly deploy
#
# La region es Ashburn, Virginia.
#
# Miami era la opcion obvia por cercania, pero Fly la retiro en 2026 junto con
# otras 16 regiones: `fly deploy` responde "Region mia is deprecated and cannot
# have new resources provisioned".
#
# De las que quedan, la eleccion no es por distancia a Nicaragua sino por
# distancia a la base de datos. Neon vive en us-east-2 (Ohio) y cada peticion
# de la API hace varias consultas, asi que esos viajes se multiplican mientras
# que el del telefono ocurre una sola vez:
#
#   iad (Ashburn)  ~70 ms al telefono + ~15 ms por consulta
#   dfw (Dallas)   ~55 ms al telefono + ~25 ms por consulta
#
# Con tres consultas por peticion iad ya gana, y con cinco gana por mucho.
# `fly platform regions` lista las vigentes.

app = "the-cage-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Las migraciones corren ANTES de que entre trafico a la version nueva. Si
# fallan, el despliegue se aborta y la version anterior sigue sirviendo: es lo
# que evita que una migracion rota tire el gimnasio entero.
[deploy]
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Cero maquinas paradas costaria menos, pero la primera peticion del dia
  # tardaria en arrancar. Una encendida es la diferencia entre una app que
  # responde y una que "va lenta".
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB da margen a Argon2, que reserva 64 MiB por hash y puede tener varios
  # logins a la vez. Con 256 MB el contenedor muere justo cuando entra gente.
  memory = "512mb"
